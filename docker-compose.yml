services:
  # Gateway mode. Kaseya credentials arrive per request on X-Kaseya-VSA-* headers.
  # Do not set KASEYA_VSA_TENANT_URL, KASEYA_VSA_USERNAME, KASEYA_VSA_PASSWORD,
  # KASEYA_VSA_K1_TOKEN, or env_file here — that would put static vendor
  # credentials in the container. Compose interpolates CONDUIT_S2S_SECRET from
  # the project .env. For AUTH_MODE=env, pass those variables on that process
  # instead (see the README).
  kaseya-vsa-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 0.0.0.0 is the interface inside the container. The port publish above
      # stays on loopback. Startup still refuses to run without a real
      # CONDUIT_S2S_SECRET.
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
